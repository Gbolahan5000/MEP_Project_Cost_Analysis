<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEP Project Operations</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --text:#1b2430; --secondary:#4a5666; --border:#d5dbe3;
  --chart-1:#1f5fbf; --chart-2:#b4531a; --chart-3:#6b7788; --track:#e6ebf1; --head:#eef2f7;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#10151c; --card:#1a222d; --text:#e8edf3; --secondary:#aab4c2; --border:#334050;
    --chart-1:#6fa3f0; --chart-2:#f0a066; --chart-3:#8f9bab; --track:#2a3544; --head:#222c39;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
h1{margin:0;font-size:1.5rem;line-height:1.2}
.sub{margin:4px 0 0;color:var(--secondary);font-size:.9rem}
.badge{display:inline-block;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.82rem;color:var(--secondary)}
.banner{border:1px solid var(--border);border-left:3px solid var(--chart-2);background:var(--card);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:.88rem;color:var(--secondary)}
.banner strong{color:var(--text)}
nav[role=tablist]{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:18px}
nav button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--secondary);cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--text);border-bottom-color:var(--chart-1);font-weight:600}
nav button:focus-visible,.tablewrap:focus-visible,summary:focus-visible{outline:3px solid var(--chart-1);outline-offset:2px}
.page{display:grid;gap:24px;min-width:0}
.page[hidden]{display:none}
h2{margin:0;font-size:1.2rem}
h3{margin:0 0 4px;font-size:1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;min-width:0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;min-width:0}
.kpi .t{font-size:.8rem;color:var(--secondary);margin:0}
.kpi .v{font-size:1.7rem;font-weight:700;line-height:1.2;margin:4px 0}
.kpi .d{font-size:.78rem;color:var(--secondary);margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:20px;min-width:0}
.two>*{min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0}
.card>p.desc{margin:0 0 12px;color:var(--secondary);font-size:.85rem}
ul.bars{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.bars li{display:grid;grid-template-columns:minmax(110px,34%) 1fr auto;gap:8px;align-items:center;font-size:.85rem}
.bl{overflow-wrap:anywhere}
.bt{display:block;height:14px;background:var(--track);border-radius:7px;overflow:hidden}
.bf{display:block;height:100%;background:var(--chart-1);border-radius:7px}
.bf.warn{background:var(--chart-2)}
.bf.neutral{background:var(--chart-3)}
.bv{font-variant-numeric:tabular-nums;font-weight:600;min-width:4.5em;text-align:right}
.legend{font-size:.78rem;color:var(--secondary);margin:10px 0 0}
.tablewrap{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.83rem}
caption{text-align:left;padding:0;position:absolute;left:-9999px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{position:sticky;top:0;background:var(--head);font-weight:600;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.wrap-cell{white-space:normal;min-width:200px}
.action{border:1px solid var(--border);border-left:3px solid var(--chart-1);border-radius:var(--radius);background:color-mix(in srgb,var(--chart-1) 7%,var(--card));padding:14px 18px}
.action strong{display:block;margin-bottom:5px;font-size:.9rem}
.action p{margin:0;color:var(--secondary);line-height:1.5}
details.src{margin-top:12px;font-size:.78rem;color:var(--secondary)}
details.src summary{cursor:pointer}
details.src p,details.src ul{margin:6px 0}
details.src code{display:block;white-space:pre-wrap;background:var(--head);border-radius:6px;padding:8px;font-size:.75rem;color:var(--text)}
.note{font-size:.8rem;color:var(--secondary);margin:0}
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--border);font-size:.8rem;color:var(--secondary)}
footer p{margin:0 0 8px}
@media (max-width:760px){
  .two{grid-template-columns:minmax(0,1fr)}
  ul.bars li{grid-template-columns:1fr auto}
  ul.bars li .bl{grid-column:1/-1}
  .bt{grid-column:1}
  .kpi .v{font-size:1.45rem}
  .wrap{padding:12px}
}
</style>
</head>

  if (!rows.length) return `<p class="note">No rows in data.json.</p>`;
  const head = cols.map(c=>`<th scope="col" class="${c.n?"n":""}">${esc(c.label)}</th>`).join("");
  const body = rows.map(r=>`<tr>`+cols.map(c=>{
    const raw = r[c.field];
    const txt = c.render ? c.render(raw, r) : (raw == null ? DASH : raw);
    const tip = c.tip ? c.tip(raw, r) : "";
    return `<td class="${c.n?"n":""}${c.wrap?" wrap-cell":""}"${tip?` title="${esc(tip)}"`:""}>${esc(txt)}</td>`;
  }).join("")+`</tr>`).join("");
  return `<div class="tablewrap" tabindex="0" role="region" aria-label="${esc(label)}"><table><caption>${esc(label)}</caption><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const col = (field,label,x) => Object.assign({field,label},x||{});
function action(title, text){ return `<aside class="action" aria-label="${esc(title)}"><strong>Next action</strong><p>${esc(text)}</p></aside>`; }

/* ---------- pages ---------- */
function deliveryPage(){
  const wo = rowsOf("workorder_schedule").sort((a,b)=>b.MeanFinishDelayDays-a.MeanFinishDelayDays);
  const proj = rowsOf("project_schedule").sort((a,b)=>b.ProjectScheduleVarianceDays-a.ProjectScheduleVarianceDays);
  const conf = rowsOf("status_conflicts").sort((a,b)=>String(a.PlannedEndDate).localeCompare(String(b.PlannedEndDate)));
  const future = conf.filter(r=>r.ActualEndDate && asOf && r.ActualEndDate > asOf).length;
  const kp = [
    kpi("Completed projects late", percent(S.completedProjectsLateRate),
      `${integer(S.completedProjectsLateCount)} of ${integer(S.completedStatusProjects)} completed projects finished after plan. Median slippage was ${integer(S.completedProjectMedianScheduleVarianceDays)} days.`),
    kpi("Work orders late", percent(S.lateWorkOrderRate),
      `${integer(S.lateWorkOrders)} of ${integer(S.workOrders)} work orders finished late; ${integer(S.workOrdersOver10DaysLate)} were more than 10 days late.`),
    kpi("Completed milestones late", percent(S.lateCompletedMilestoneRate),
      `${integer(S.lateCompletedMilestones)} of ${integer(S.completedMilestones)} completed milestone records were late.`),
    kpi("Projects past planned end", integer(S.nonCompletedProjectsPastPlannedEnd),
      `Projects not marked Completed whose planned end had passed by ${asOfH}. Separately, ${integer(conf.length)} non-completed rows contain an ActualEndDate.`)
  ].join("");
  const c1 = card("Mean work-order finish delay by category (days)",
    "Calendar days from planned to actual finish, averaged by work-order category. The export does not establish a single cause.",
    bars(wo,{label:"WorkCategory",value:"MeanFinishDelayDays",fmt:v=>dec1(v)+" d",
      tip:r=>`${r.WorkCategory}: mean delay ${dec1(r.MeanFinishDelayDays)} days; ${integer(r.LateWorkOrders)} of ${integer(r.WorkOrders)} work orders late`}),
    "workorder_schedule");
  const t1 = card("Completed project slippage",
    `All ${integer(proj.length)} completed projects, sorted from the largest delay to the earliest completion. Negative values indicate completion before plan.`,
    table("Completed project slippage", proj, [
      col("ProjectID","Project"), col("ProjectType","Type"), col("ClientSector","Client sector"), col("City","City"),
      col("ProjectScheduleVarianceDays","Schedule variance",{n:true,render:signedDays,tip:(v,r)=>`Planned end ${r.PlannedEndDate}; actual end ${r.ActualEndDate}`})
    ]), "project_schedule");
  const t2 = card("Status and end-date conflicts",
    `Rows not marked Completed with an ActualEndDate${asOf?` (${integer(future)} of ${integer(conf.length)} recorded dates fall after ${asOfH})`:""}. Confirm whether each date is actual or forecast before using status for an overdue-project list.`,
    table("Status and end-date conflicts", conf, [
      col("ProjectID","Project"), col("ProjectType","Type"), col("Status","Status"),
      col("PlannedEndDate","Planned end",{render:humanDate}), col("ActualEndDate","Recorded actual end",{render:humanDate})
    ]), "status_conflicts");
  return `<h2>Delivery performance</h2><div class="kpis">${kp}</div>${c1}<div class="two">${t1}${t2}</div>` +
    action("Delivery action", `Run a weekly work-package lookahead. Reconcile the ${integer(conf.length)} status/date conflicts before treating the ${integer(S.nonCompletedProjectsPastPlannedEnd)} projects past planned end as a current overdue list.`);
}

function costPage(){
  const disc = rowsOf("direct_cost").sort((a,b)=>b.DirectCostVarianceNGNm-a.DirectCostVarianceNGNm);
  const cat = rowsOf("cost_categories").sort((a,b)=>b.DirectCostVarianceNGNm-a.DirectCostVarianceNGNm);
  const sup = rowsOf("procurement").sort((a,b)=>b.LateRate-a.LateRate);
  const led = rowsOf("material_reconciliation");
  const ratio = S.procurementToWorkOrderMaterialRatio;
  const ratioT = isN(ratio) ? ratio.toFixed(1) + "\u00D7" : DASH;
  const kp = [
    kpi("Work-order direct cost over plan", isN(S.workOrderCostVarianceNGN) ? "+" + millions(S.workOrderCostVarianceNGN) : DASH,
      `${percent(S.workOrderCostVariancePct)} above the work-order plan; ${integer(S.projectsWorkOrderDirectCostOverPlanCount)} of ${integer(S.projects)} projects are above plan. A proxy using labour-entry costs and work-order material actuals; not project margin.`,
      exact(S.workOrderCostVarianceNGN)),
    kpi("Purchase orders delivered late", percent(S.latePurchaseOrderRate),
      `${integer(S.latePurchaseOrders)} of ${integer(S.purchaseOrders)} POs were late; median delay among late POs was ${integer(S.medianLateDeliveryDays)} days.`),
    kpi("PO actual above quoted", percent(S.purchaseOrderPriceVariancePct),
      `${compact(S.purchaseOrderPriceVarianceNGN)} higher than quoted (${compact(S.purchaseOrderActualNGN)} actual vs ${compact(S.purchaseOrderQuotedNGN)} quoted).`,
      exact(S.purchaseOrderPriceVarianceNGN)),
    kpi("PO / work-order material ratio", ratioT,
      `Purchase-order actuals divided by work-order material actuals. The ${ratioT} gap is a reconciliation signal, not a like-for-like margin measure.`)
  ].join("");
  const barTip = (k,name)=>r=>`${r[name]}: ${exact(r.DirectCostVarianceNGN)} over plan; planned ${exact(r.PlannedDirectCostNGN)}, actual ${exact(r.ActualDirectCostNGN)}; ${integer(r.WorkOrders)} work orders`;
  const c1 = card("Direct cost variance by discipline (\u20A6m)",
    "Actual work-order direct-cost proxy less work-order plan, in NGN millions. Positive values are over plan.",
    bars(disc,{label:"Discipline",value:"DirectCostVarianceNGNm",fmt:v=>isN(v)?"\u20A6"+v.toFixed(1)+"m":DASH,tip:barTip(0,"Discipline")}), "direct_cost");
  const c2 = card("Direct cost variance by work category (\u20A6m)",
    "Actual work-order direct-cost proxy less work-order plan, in NGN millions. Categories with positive variance are over plan.",
    bars(cat,{label:"WorkCategory",value:"DirectCostVarianceNGNm" in (cat[0]||{}) ? "DirectCostVarianceNGNm" : "DirectCostVarianceNGN",fmt:v=>"DirectCostVarianceNGNm" in (cat[0]||{}) ? (isN(v)?"\u20A6"+v.toFixed(1)+"m":DASH) : millions(v),tip:barTip(0,"WorkCategory")}), "cost_categories");
  const c3 = card("Purchase-order late rate by supplier",
    "Late purchase orders divided by purchase orders for each supplier (bar scale 0\u2013100%). The ranking directs a recovery review; it does not prove supplier lateness caused project delays.",
    bars(sup,{label:"SupplierName",value:"LateRate",max:1,fmt:percent,
      tip:r=>`${r.SupplierName}: ${integer(r.LateOrders)} of ${integer(r.PurchaseOrders)} POs late; average delay ${dec1(r.AverageDeliveryDelayDays)} days; typical lead time ${integer(r.TypicalLeadDays)} days`}), "procurement");
  const t0 = card("Supplier delivery and price detail",
    "Descriptive supplier indicators from the purchase-order ledger. Average delay is across all of the supplier's POs.",
    table("Supplier delivery and price detail", sup, [
      col("SupplierName","Supplier"),
      col("PurchaseOrders","POs",{n:true,render:integer}),
      col("LateOrders","Late POs",{n:true,render:integer}),
      col("LateRate","Late rate",{n:true,render:percent}),
      col("AverageDeliveryDelayDays","Avg delay",{n:true,render:v=>isN(v)?dec1(v)+" d":DASH}),
      col("TypicalLeadDays","Typical lead",{n:true,render:v=>isN(v)?integer(v)+" d":DASH}),
      col("PriceVarianceNGN","Actual above quoted",{n:true,render:compact,tip:v=>exact(v)})
    ]), "procurement");
  const t1 = card("Material ledgers to reconcile",
    `These totals have different source grains and accounting scopes. Use the table to locate the ${ratioT} mismatch; do not add purchase-order totals to work-order costs until the ledgers are reconciled. Not an operational-waste or profitability measure.`,
    table("Material ledgers to reconcile", led, [
      col("Ledger","Ledger"), col("Grain","Grain"),
      col("ValueNGN","Value",{n:true,render:billions}),
      col("ValueNGN","Exact value",{n:true,render:exact}),
      col("Interpretation","Definition",{wrap:true})
    ]), "material_reconciliation");
  return `<h2>Cost &amp; procurement</h2><div class="kpis">${kp}</div><div class="two">${c1}${c2}</div>${c3}${t0}${t1}` +
    action("Cost and procurement action", `Finance and Procurement should tie PO actuals to receipts, AP postings, and work-order material by project and work order, and reconcile the ledgers before any project profitability ranking. Link critical POs to required-on-site dates before assigning schedule impact.`);
}

function cashPage(){
  const order = ["Not yet due","1-30 days","31-60 days","61-90 days","Over 90 days"];
  const age = rowsOf("receivables").sort((a,b)=>order.indexOf(a.AgingBand)-order.indexOf(b.AgingBand));
  const coll = rowsOf("collection_projects").filter(r=>r.OverdueBalanceNGN>0).sort((a,b)=>b.OverdueBalanceNGN-a.OverdueBalanceNGN);
  const chg = rowsOf("changes").sort((a,b)=>(a.ApprovalStatus==="Pending"?-1:1)-(b.ApprovalStatus==="Pending"?-1:1));
  const iss = rowsOf("issues").filter(r=>r.OpenIssues>0).sort((a,b)=>b.OpenIssues-a.OpenIssues);
  const kp = [
    kpi("Overdue receivables", billions(S.overdueBalanceByAsOfNGN),
      `${integer(S.overdueInvoicesByAsOf)} invoices past due. Aging is measured as of ${asOfH} from invoice and payment dates.`, exact(S.overdueBalanceByAsOfNGN)),
    kpi("Receivables over 90 days", billions(S.unpaidBalanceOver90DaysNGN),
      "Unpaid balance more than 90 days past due. Work the oldest invoices first.", exact(S.unpaidBalanceOver90DaysNGN)),
    kpi("Pending change-order value", millions(S.pendingChangeOrderValueNGN),
      `${integer(S.pendingChangeOrderCount)} change orders remain pending; the amount is outside the approved-change invoice reconciliation.`, exact(S.pendingChangeOrderValueNGN)),
    kpi("Open high-severity issues", integer(S.openHighSeverityIssues),
      `${integer(S.openIssues)} issues are open with ${integer(S.openIssueImpactDays)} estimated impact days. Estimated issue impact is not observed schedule delay.`)
  ].join("");
  const c1 = card("Unpaid balance by age (\u20A6m)",
    `Positive unpaid invoice balance as of ${asOfH}. Not-yet-due amounts (grey) are separated from overdue balances (orange).`,
    bars(age,{label:"AgingBand",value:"BalanceNGN",fmt:compact,color:r=>r.AgingBand==="Not yet due"?"neutral":"warn",
      tip:r=>`${r.AgingBand}: ${exact(r.BalanceNGN)} across ${integer(r.Invoices)} invoices`}), "receivables");
  const t1 = card("Projects with the largest overdue balances",
    `Positive overdue balances only (${integer(coll.length)} projects), sorted largest first. Validate disputes and cash application against the receivables ledger before client escalation.`,
    table("Projects with the largest overdue balances", coll, [
      col("ProjectID","Project"),
      col("OverdueBalanceNGN","Overdue",{n:true,render:millions,tip:v=>exact(v)}),
      col("UnpaidInvoices","Unpaid invoices",{n:true,render:integer})
    ]), "collection_projects");
  const t2 = card("Change orders by approval status",
    "Reported schedule-impact days are summed from change-order records; they are not observed project delay.",
    table("Change orders by approval status", chg, [
      col("ApprovalStatus","Status"),
      col("ChangeOrders","Change orders",{n:true,render:integer}),
      col("ValueNGN","Value",{n:true,render:millions,tip:v=>exact(v)}),
      col("ScheduleImpactDays","Reported impact days",{n:true,render:integer})
    ]), "changes");
  const c2 = card("Open issues by category",
    "Open issue counts by type. Review the open high-severity issues first; the KPI above shows that count.",
    bars(iss,{label:"IssueType",value:"OpenIssues",fmt:integer,
      tip:r=>`${r.IssueType}: ${integer(r.OpenIssues)} open of ${integer(r.Issues)} logged; ${integer(r.EstimatedImpactDays)} estimated impact days and ${integer(r.HighSeverity)} high-severity (all logged issues of this type)`}), "issues");
  return `<h2>Cash &amp; operational controls</h2><div class="kpis">${kp}</div><div class="two">${c1}${t1}</div><div class="two">${t2}${c2}</div>` +
    action("Cash and controls action", `Prioritize the ${billions(S.unpaidBalanceOver90DaysNGN)} balance over 90 days, validate the ${integer(S.invoicesStatusNotYetDueButDueDatePastAsOf)} invoices (${millions(S.amountStatusNotYetDueButDueDatePastAsOfNGN)}) labelled Not Yet Due whose due dates have passed, gate pending scope until approved, and review the ${integer(S.openHighSeverityIssues)} open high-severity issues before affected work is released.`);
}

/* ---------- shell ---------- */
const pages = [
  {id:"delivery", label:"Delivery", html:deliveryPage},
  {id:"cost-supply", label:"Cost & supply", html:costPage},
  {id:"cash-controls", label:"Cash & controls", html:cashPage}
];
const $ = id => document.getElementById(id);
$("title").textContent = DATA.title || "MEP Project Operations";
$("subtitle").textContent = "Delivery, cost & supply, and cash & controls across " + integer(S.projects) + " projects";
$("asof").textContent = "Snapshot as of " + asOfH;
$("banner").innerHTML = `<strong>Static supplied snapshot, not a live feed.</strong> Figures are a reviewed simulation fixture (status: ${esc(DATA.status||DASH)}) as of ${esc(asOfH)}, generated from user-supplied files. Money is nominal Nigerian naira (\u20A6). Lateness and supplier indicators are descriptive, not causal.`;

$("tabs").innerHTML = pages.map(p=>`<button role="tab" id="tab-${p.id}" aria-controls="page-${p.id}" aria-selected="false" tabindex="-1" data-id="${p.id}">${esc(p.label)}</button>`).join("");
$("pages").innerHTML = pages.map(p=>`<section class="page" id="page-${p.id}" role="tabpanel" aria-labelledby="tab-${p.id}" hidden>${p.html()}</section>`).join("");

const q = Q.quality && Q.quality.rows ? Q.quality.rows : [];
$("footer").innerHTML = `<p><strong>Data provenance:</strong> ${esc((Q.portfolio.source||{}).label||"Supplied files")} \u00B7 as of ${esc(asOfH)} \u00B7 static snapshot, no network calls. Invoice metrics exclude invoices dated after ${esc(asOf)}; payments count only when dated on or before that day. Exact values appear in tooltips (hover/long-press) and tables; each chart has a Source &amp; method note.</p>` +
  (q.length ? `<details class="src"><summary>Data-quality checks (${integer(q.length)})</summary><ul>${q.map(r=>`<li><strong>${esc(r.Check)}:</strong> ${esc(r.Finding)}</li>`).join("")}</ul></details>` : "");

function show(id, focus){
  if (!pages.some(p=>p.id===id)) id = pages[0].id;
  pages.forEach(p=>{
    const sel = p.id === id;
    const b = $("tab-"+p.id);
    b.setAttribute("aria-selected", sel ? "true" : "false");
    b.tabIndex = sel ? 0 : -1;
    $("page-"+p.id).hidden = !sel;
    if (sel && focus) b.focus();
  });
  try { if (location.hash !== "#"+id) history.replaceState(null,"","#"+id); } catch(e){}
}
$("tabs").addEventListener("click", e=>{ const b = e.target.closest("button[data-id]"); if (b) show(b.dataset.id); });
$("tabs").addEventListener("keydown", e=>{
  const i = pages.findIndex(p=>$("tab-"+p.id).getAttribute("aria-selected")==="true");
  let n = null;
  if (e.key==="ArrowRight") n = (i+1)%pages.length;
  else if (e.key==="ArrowLeft") n = (i-1+pages.length)%pages.length;
  else if (e.key==="Home") n = 0;
  else if (e.key==="End") n = pages.length-1;
  if (n !== null){ e.preventDefault(); show(pages[n].id, true); }
});
window.addEventListener("hashchange", ()=>show((location.hash||"").slice(1)));
show((location.hash||"").slice(1));
})();
</script>
